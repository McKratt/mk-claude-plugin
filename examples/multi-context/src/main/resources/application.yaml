# Graceful shutdown (already the Spring Boot 4 default, stated explicitly): on SIGTERM the server stops accepting
# requests and lets running ones complete for at most the lifecycle timeout; the context then closes its beans,
# the Hikari pool among them.
server:
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: shop-multi-context
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shop}
    username: ${DB_USER:shop}
    password: ${DB_PASSWORD:shop}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update  # example only: use Flyway or Liquibase in a real project
