server:
  port: 8080
  host: 0.0.0.0

# One HikariCP connection pool (plain JDBC) for the application; each bounded context owns its own schema
# (shop_order, shop_billing). Environment variables override these keys, for example DB_CONNECTION_URL.
db:
  connection:
    url: jdbc:postgresql://localhost:5432/shop
    username: shop
    password: shop
  pool:
    maximum-pool-size: 10
