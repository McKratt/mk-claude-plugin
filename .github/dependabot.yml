version: 2
updates:
  - package-ecosystem: maven
    directories:
      - /examples/single-context
      - /examples/multi-context
      - /examples/helidon-single-context
      - /examples/helidon-multi-context
    schedule:
      interval: weekly
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
