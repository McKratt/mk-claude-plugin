name: examples

on:
  push:
    paths: ["examples/**", ".github/workflows/examples.yml"]
  pull_request:
    paths: ["examples/**", ".github/workflows/examples.yml"]

env:
  MAVEN_VERSION: 3.10.0

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [single-context, multi-context]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: examples/${{ matrix.project }}/pom.xml
      - name: Install Maven
        run: |
          curl -fsSL "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"
      - run: mvn -version
      - name: Build and test (includes ArchUnit)
        working-directory: examples/${{ matrix.project }}
        run: |
          set -o pipefail
          mvn -B -ntp verify 2>&1 | tee build.log || {
            grep -hE "Class <|Caused by|Method <|Constructor <|Field <|Error creating|Unsatisfied|No qualifying|Failed to|^\[ERROR\]   |AssertionError|Expecting|expected|Exception" build.log target/surefire-reports/*.txt 2>/dev/null | sort -u | head -40 \
              | while IFS= read -r l; do echo "::error::${l:0:900}"; done
            exit 1
          }

  lombok-ban:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: examples/*/pom.xml
      - name: Install Maven
        run: |
          curl -fsSL "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"
      - run: examples/verify-lombok-ban.sh
